# Nginx sample rewrite for ThinkPHP 8 / YshopAdmin (SPA site-ui + Admin API)
# Place site root at .../public

# Admin entry: /yshopadmin → yshopadmin.php
location /yshopadmin {
    if (!-e $request_filename) {
        rewrite ^/yshopadmin$ /yshopadmin.php last;
        rewrite ^/yshopadmin/(.*)$ /yshopadmin.php/$1 last;
        break;
    }
}

# Site SPA built assets (Vite base=/site/)
location /site/ {
    try_files $uri $uri/ =404;
}

# Legacy: older builds used base=/ and referenced /assets/*
location /assets/ {
    try_files /site$uri =404;
}

# Front API + machine endpoints
location ~ ^/(api|captcha|sitemap|go|addons)/ {
    try_files $uri /index.php?s=$uri&$args;
}

# SPA HTML routes (channel / archives / page / search …)
location / {
    try_files $uri $uri/ /site/index.html;
}

location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
}
