# Nginx sample rewrite for ThinkPHP 8 / YshopAdmin
# Place site root at .../public

# Admin entry: /yshopadmin → yshopadmin.php (PATH_INFO without prefix)
location /yshopadmin {
    if (!-e $request_filename) {
        rewrite ^/yshopadmin$ /yshopadmin.php last;
        rewrite ^/yshopadmin/(.*)$ /yshopadmin.php/$1 last;
        break;
    }
}

# Front entry
location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php?s=$1 last;
        break;
    }
}

location ~ \.php$ {
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
}
