<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="修改定时任务" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-job-edit">
  <input type="hidden" name="jobId" value="{$job.jobId}">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">任务名称：</label>
    <div class="col-sm-8"><input class="form-control" type="text" name="jobName" value="{$job.jobName}" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">任务分组：</label>
    <div class="col-sm-8">
      <select name="jobGroup" class="form-control m-b">
        {volist name="jobGroupDict" id="d"}
        <option value="{$d.dictValue}" {if $job.jobGroup == $d.dictValue}selected{/if}>{$d.dictLabel}</option>
        {/volist}
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">调用目标字符串：</label>
    <div class="col-sm-8"><input class="form-control" type="text" name="invokeTarget" value="{$job.invokeTarget}" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">cron表达式：</label>
    <div class="col-sm-8"><input class="form-control" type="text" name="cronExpression" value="{$job.cronExpression}" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">执行策略：</label>
    <div class="col-sm-8">
      <label class="radio-box"><input type="radio" name="misfirePolicy" value="1" {if $job.misfirePolicy == '1'}checked{/if}> 立即执行</label>
      <label class="radio-box"><input type="radio" name="misfirePolicy" value="2" {if $job.misfirePolicy == '2'}checked{/if}> 执行一次</label>
      <label class="radio-box"><input type="radio" name="misfirePolicy" value="3" {if $job.misfirePolicy == '3'}checked{/if}> 放弃执行</label>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">是否并发：</label>
    <div class="col-sm-8">
      <label class="radio-box"><input type="radio" name="concurrent" value="0" {if $job.concurrent == '0'}checked{/if}> 允许</label>
      <label class="radio-box"><input type="radio" name="concurrent" value="1" {if $job.concurrent == '1'}checked{/if}> 禁止</label>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">状态：</label>
    <div class="col-sm-8">
      <label class="radio-box"><input type="radio" name="status" value="0" {if $job.status == '0'}checked{/if}> 正常</label>
      <label class="radio-box"><input type="radio" name="status" value="1" {if $job.status == '1'}checked{/if}> 暂停</label>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">备注：</label>
    <div class="col-sm-8"><textarea name="remark" class="form-control">{$job.remark}</textarea></div>
  </div>
</form>
</div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "monitor/job";
$("#form-job-edit").validate({focusCleanup:true});
function submitHandler(){
  if($.validate.form()){ $.operate.save(prefix + "/edit", $("#form-job-edit").serialize()); }
}
</script>
</body></html>
