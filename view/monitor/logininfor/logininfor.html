<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="登录日志" /}</head>
<body class="gray-bg">
<div class="container-div"><div class="row">
<div class="col-sm-12 search-collapse">
<form id="formId"><div class="select-list"><ul>
<li>登录地址：<input type="text" name="ipaddr"/></li>
<li>登录名称：<input type="text" name="loginName"/></li>
<li>状态：<select name="status"><option value="">所有</option><option value="0">失败</option><option value="1">成功</option></select></li>
<li><a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a></li>
</ul></div></form>
</div>
<div class="btn-group-sm" id="toolbar">
<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"><i class="fa fa-remove"></i> 删除</a>
<a class="btn btn-danger" onclick="$.operate.clean()"><i class="fa fa-trash"></i> 清空</a>
<a class="btn btn-primary single disabled" onclick="unlock()"><i class="fa fa-unlock"></i> 解锁</a>
<a class="btn btn-warning" onclick="$.table.exportExcel()"><i class="fa fa-download"></i> 导出</a>
</div>
<div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div>
</div></div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "monitor/logininfor";
$(function(){
  $.table.init({
    id: "bootstrap-table",
    uniqueId: "infoId",
    url: prefix + "/list",
    removeUrl: prefix + "/remove",
    cleanUrl: prefix + "/clean",
    exportUrl: prefix + "/export",
    modalName: "登录日志",
    columns: [
      {checkbox:true},
      {field:"infoId", title:"访问编号"},
      {field:"loginName", title:"登录名称"},
      {field:"ipaddr", title:"登录地址"},
      {field:"browser", title:"浏览器"},
      {field:"os", title:"操作系统"},
      {field:"status", title:"登录状态", formatter:function(v){return v=="1"||v==1?"成功":"失败";}},
      {field:"msg", title:"操作信息"},
      {field:"loginTime", title:"登录时间"}
    ]
  });
});
function unlock(){
  var name = $.table.selectColumns("loginName");
  if(name.length == 0){ $.modal.alertWarning("请选择要解锁的用户"); return; }
  $.modal.confirm("确认要解锁用户" + name[0] + "吗？", function(){
    $.operate.post(prefix + "/unlock", {loginName: name[0]});
  });
}
</script>
</body></html>
