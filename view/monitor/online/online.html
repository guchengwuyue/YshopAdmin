<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="在线用户" /}</head>
<body class="gray-bg">
<div class="container-div"><div class="row">
<div class="col-sm-12 search-collapse">
<form id="online-form"><div class="select-list"><ul>
<li>登录地址：<input type="text" name="ipaddr"/></li>
<li>登录名称：<input type="text" name="loginName"/></li>
<li><a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a></li>
</ul></div></form>
</div>
<div class="btn-group-sm" id="toolbar" role="group">
<a class="btn btn-danger multiple disabled" onclick="batchForceLogout()"><i class="fa fa-sign-out"></i> 强退</a>
</div>
<div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div>
</div></div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "monitor/online";
$(function(){
  $.table.init({
    uniqueId: "sessionId",
    url: prefix + "/list",
    sortName: "lastAccessTime",
    sortOrder: "desc",
    modalName: "在线用户",
    columns: [
      {checkbox:true},
      {field:"sessionId", title:"会话编号"},
      {field:"loginName", title:"登录名称"},
      {field:"deptName", title:"部门名称"},
      {field:"ipaddr", title:"主机"},
      {field:"loginLocation", title:"登录地点"},
      {field:"browser", title:"浏览器"},
      {field:"os", title:"操作系统"},
      {field:"status", title:"会话状态", align:"center", formatter:function(v){
        if(v=="on_line") return '<span class="badge badge-primary">在线</span>';
        if(v=="off_line") return '<span class="badge badge-danger">离线</span>';
        return v||"";
      }},
      {field:"startTimestamp", title:"登录时间"},
      {field:"lastAccessTime", title:"最后访问时间"},
      {title:"操作", align:"center", formatter:function(v,row){
        return '<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="forceLogout(\''+row.sessionId+'\')"><i class="fa fa-sign-out"></i>强退</a>';
      }}
    ]
  });
});
function forceLogout(sessionId){
  $.modal.confirm("确定要强制选中用户下线吗？", function(){
    $.operate.post(prefix + "/batchForceLogout", {"ids": sessionId});
  });
}
function batchForceLogout(){
  var rows = $.table.selectColumns("sessionId");
  if(rows.length == 0){
    $.modal.alertWarning("请选择要强退的用户");
    return;
  }
  $.modal.confirm("确认要强退选中的" + rows.length + "条数据吗?", function(){
    $.operate.post(prefix + "/batchForceLogout", {"ids": rows.join()});
  });
}
</script>
</body></html>
