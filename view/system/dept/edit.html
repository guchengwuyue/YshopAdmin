<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="修改部门" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-dept-edit">
  <input name="deptId" type="hidden" value="{$dept.deptId}">
  <input id="treeId" name="parentId" type="hidden" value="{$dept.parentId}">
  <div class="form-group">
    <label class="col-sm-3 control-label">上级部门：</label>
    <div class="col-sm-8">
      <div class="input-group">
        <input class="form-control" type="text" id="treeName" onclick="selectDeptTree()" value="{$parent.deptName|default=''}" readonly>
        <span class="input-group-addon" onclick="selectDeptTree()" style="cursor:pointer"><i class="fa fa-search"></i></span>
      </div>
    </div>
  </div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">部门名称：</label><div class="col-sm-8"><input name="deptName" class="form-control" value="{$dept.deptName}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">显示排序：</label><div class="col-sm-8"><input name="orderNum" type="number" class="form-control" value="{$dept.orderNum}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">负责人：</label><div class="col-sm-8"><input name="leader" class="form-control" value="{$dept.leader}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">联系电话：</label><div class="col-sm-8"><input name="phone" class="form-control" value="{$dept.phone}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">邮箱：</label><div class="col-sm-8"><input name="email" class="form-control" value="{$dept.email}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="0" {if $dept.status=='0'}checked{/if}>正常</label><label class="radio-box"><input type="radio" name="status" value="1" {if $dept.status=='1'}checked{/if}>停用</label></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "system/dept";

function submitHandler() {
  if ($.validate.form()) {
    $.operate.save(prefix + "/edit", $("#form-dept-edit").serialize());
  }
}

/* 部门管理-修改-选择部门树 */
function selectDeptTree() {
  var deptId = $("#treeId").val();
  var excludeId = $("input[name='deptId']").val();
  if (deptId > 0) {
    $.modal.openOptions({
      title: "部门选择",
      width: "380",
      url: prefix + "/selectDeptTree/" + deptId + "/" + excludeId,
      callBack: function(index, layero) {
        var body = $.modal.getChildFrame(index);
        $("#treeId").val(body.find("#treeId").val());
        $("#treeName").val(body.find("#treeName").val());
        $.modal.close(index);
      }
    });
  } else {
    $.modal.alertError("父部门不能选择");
  }
}
</script>
</body>
</html>
