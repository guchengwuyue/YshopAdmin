<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="添加部门" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-dept-add">
  <input id="treeId" name="parentId" type="hidden" value="{$dept.deptId|default=0}">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">上级部门：</label>
    <div class="col-sm-8">
      <div class="input-group">
        <input class="form-control" type="text" onclick="selectDeptTree()" id="treeName" value="{$dept.deptName|default='主类目'}" readonly required>
        <span class="input-group-addon" onclick="selectDeptTree()" style="cursor:pointer"><i class="fa fa-search"></i></span>
      </div>
    </div>
  </div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">部门名称：</label><div class="col-sm-8"><input name="deptName" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">显示排序：</label><div class="col-sm-8"><input name="orderNum" type="number" class="form-control" value="0"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">负责人：</label><div class="col-sm-8"><input name="leader" class="form-control"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">联系电话：</label><div class="col-sm-8"><input name="phone" class="form-control"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">邮箱：</label><div class="col-sm-8"><input name="email" class="form-control"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="0" checked>正常</label><label class="radio-box"><input type="radio" name="status" value="1">停用</label></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "system/dept";

function submitHandler() {
  if ($.validate.form()) {
    $.operate.save(prefix + "/add", $("#form-dept-add").serialize());
  }
}

/* 部门管理-新增-选择父部门树 */
function selectDeptTree() {
  var treeId = $("#treeId").val();
  if ($.common.isEmpty(treeId)) {
    $.modal.alertWarning("请先添加部门数据！");
    return;
  }
  $.modal.openOptions({
    title: "部门选择",
    width: "380",
    url: prefix + "/selectDeptTree/" + treeId + "/0",
    callBack: function(index, layero) {
      var body = $.modal.getChildFrame(index);
      $("#treeId").val(body.find("#treeId").val());
      $("#treeName").val(body.find("#treeName").val());
      $.modal.close(index);
    }
  });
}
</script>
</body>
</html>
