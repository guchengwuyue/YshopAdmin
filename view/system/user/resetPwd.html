<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="重置密码" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-user-resetPwd">
  <input name="userId" type="hidden" value="{$user.userId}">
  <div class="form-group"><label class="col-sm-3 control-label">登录名称：</label><div class="col-sm-8"><input class="form-control" value="{$user.loginName}" readonly></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">新密码：</label><div class="col-sm-8"><input name="password" type="password" class="form-control" required></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"system/user/resetPwd", $("#form-user-resetPwd").serialize()); } }</script>
</body></html>
