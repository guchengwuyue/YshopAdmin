<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="修改密码" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-resetPwd">
  <div class="form-group"><label class="col-sm-3 control-label is-required">旧密码：</label><div class="col-sm-8"><input name="oldPassword" type="password" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">新密码：</label><div class="col-sm-8"><input name="newPassword" type="password" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">确认：</label><div class="col-sm-8"><input name="confirmPassword" type="password" class="form-control" required></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"system/user/profile/resetPwd", $("#form-resetPwd").serialize()); } }</script>
</body></html>
