<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="添加岗位" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-post-add">
  <div class="form-group"><label class="col-sm-3 control-label is-required">岗位名称：</label><div class="col-sm-8"><input name="postName" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">岗位编码：</label><div class="col-sm-8"><input name="postCode" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">显示顺序：</label><div class="col-sm-8"><input name="postSort" type="number" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="0" checked>正常</label><label class="radio-box"><input type="radio" name="status" value="1">停用</label></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea name="remark" class="form-control"></textarea></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"system/post/add", $("#form-post-add").serialize()); } }</script>
</body></html>
