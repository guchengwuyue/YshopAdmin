<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="修改参数" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-config-edit">
  <input name="configId" type="hidden" value="{$config.configId}">
  <div class="form-group"><label class="col-sm-3 control-label is-required">参数名称：</label><div class="col-sm-8"><input name="configName" class="form-control" value="{$config.configName}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">参数键名：</label><div class="col-sm-8"><input name="configKey" class="form-control" value="{$config.configKey}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">参数键值：</label><div class="col-sm-8"><input name="configValue" class="form-control" value="{$config.configValue}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">系统内置：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="configType" value="Y" {if $config.configType=='Y'}checked{/if}>是</label><label class="radio-box"><input type="radio" name="configType" value="N" {if $config.configType=='N'}checked{/if}>否</label></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea name="remark" class="form-control">{$config.remark}</textarea></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"system/config/edit", $("#form-config-edit").serialize()); } }</script>
</body></html>
