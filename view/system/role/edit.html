<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="修改角色" /}{include file="/common/ztree-css" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-role-edit">
  <input name="roleId" type="hidden" value="{$role.roleId}">
  <input type="hidden" id="menuIds" name="menuIds">
  <div class="form-group"><label class="col-sm-3 control-label is-required">角色名称：</label><div class="col-sm-8"><input name="roleName" class="form-control" value="{$role.roleName}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">权限字符：</label><div class="col-sm-8"><input name="roleKey" class="form-control" value="{$role.roleKey}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">显示顺序：</label><div class="col-sm-8"><input name="roleSort" type="number" class="form-control" value="{$role.roleSort}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="0" {if $role.status=='0'}checked{/if}>正常</label><label class="radio-box"><input type="radio" name="status" value="1" {if $role.status=='1'}checked{/if}>停用</label></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">菜单权限：</label><div class="col-sm-8"><div id="menuTrees" class="ztree"></div></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea name="remark" class="form-control">{$role.remark}</textarea></div></div>
</form>
</div>
{include file="/common/footer" /}{include file="/common/ztree-js" /}
<script>
$(function(){
  var setting = {check:{enable:true}, data:{simpleData:{enable:true}}};
  $.get(ctx + "system/role/menuTreeData?roleId={$role.roleId}", function(data){
    if (!$.isArray(data)) { data = []; }
    $.fn.zTree.init($("#menuTrees"), setting, data);
  });
});
function submitHandler(){
  var tree = $.fn.zTree.getZTreeObj("menuTrees");
  var nodes = tree.getCheckedNodes(true);
  var ids = [];
  for (var i=0;i<nodes.length;i++){ ids.push(nodes[i].id); }
  $("#menuIds").val(ids.join(","));
  if($.validate.form()){ $.operate.save(ctx+"system/role/edit", $("#form-role-edit").serialize()); }
}
</script>
</body></html>
