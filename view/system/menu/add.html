<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="添加菜单" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-menu-add">
  <input id="treeId" name="parentId" type="hidden" value="{$menu.menuId|default=0}">
  <div class="form-group">
    <label class="col-sm-3 control-label">上级菜单：</label>
    <div class="col-sm-8">
      <div class="input-group">
        <input class="form-control" type="text" onclick="selectMenuTree()" id="treeName" value="{$menu.menuName|default='主目录'}" readonly>
        <span class="input-group-addon" onclick="selectMenuTree()" style="cursor:pointer"><i class="fa fa-search"></i></span>
      </div>
    </div>
  </div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">菜单类型：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="menuType" value="M">目录</label><label class="radio-box"><input type="radio" name="menuType" value="C" checked>菜单</label><label class="radio-box"><input type="radio" name="menuType" value="F">按钮</label></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">菜单名称：</label><div class="col-sm-8"><input name="menuName" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">显示排序：</label><div class="col-sm-8"><input name="orderNum" class="form-control" type="number" value="0"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">请求地址：</label><div class="col-sm-8"><input name="url" class="form-control"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">打开方式：</label><div class="col-sm-8"><select name="target" class="form-control"><option value="menuItem">页签</option><option value="menuBlank">新窗口</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">权限标识：</label><div class="col-sm-8"><input name="perms" class="form-control"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">图标：</label><div class="col-sm-8"><input name="icon" class="form-control" value="fa fa-bar-chart-o"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">显示状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="visible" value="0" checked>显示</label><label class="radio-box"><input type="radio" name="visible" value="1">隐藏</label></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "system/menu";

function submitHandler() {
  if ($.validate.form()) {
    $.operate.save(prefix + "/add", $("#form-menu-add").serialize());
  }
}

/* 菜单管理-新增-选择上级菜单树 */
function selectMenuTree() {
  var treeId = $("#treeId").val();
  if ($.common.isEmpty(treeId)) {
    treeId = "0";
  }
  $.modal.openOptions({
    title: "菜单选择",
    width: "380",
    url: prefix + "/selectMenuTree/" + treeId + "/0",
    callBack: function(index, layero) {
      var body = $.modal.getChildFrame(index);
      $("#treeId").val(body.find("#treeId").val());
      $("#treeName").val(body.find("#treeName").val());
      $.modal.close(index);
    }
  });
}
</script>
</body>
</html>
