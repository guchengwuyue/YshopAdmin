<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="修改菜单" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-menu-edit">
  <input name="menuId" type="hidden" value="{$menu.menuId}">
  <input id="treeId" name="parentId" type="hidden" value="{$menu.parentId}">
  <div class="form-group">
    <label class="col-sm-3 control-label">上级菜单：</label>
    <div class="col-sm-8">
      <div class="input-group">
        <input class="form-control" type="text" id="treeName" onclick="selectMenuTree()" value="{$parent.menuName|default='主目录'}" readonly>
        <span class="input-group-addon" onclick="selectMenuTree()" style="cursor:pointer"><i class="fa fa-search"></i></span>
      </div>
    </div>
  </div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">菜单类型：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="menuType" value="M" {if $menu.menuType=='M'}checked{/if}>目录</label><label class="radio-box"><input type="radio" name="menuType" value="C" {if $menu.menuType=='C'}checked{/if}>菜单</label><label class="radio-box"><input type="radio" name="menuType" value="F" {if $menu.menuType=='F'}checked{/if}>按钮</label></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">菜单名称：</label><div class="col-sm-8"><input name="menuName" class="form-control" value="{$menu.menuName}" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">显示排序：</label><div class="col-sm-8"><input name="orderNum" class="form-control" type="number" value="{$menu.orderNum}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">请求地址：</label><div class="col-sm-8"><input name="url" class="form-control" value="{$menu.url}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">打开方式：</label><div class="col-sm-8"><select name="target" class="form-control"><option value="menuItem" {if $menu.target=='menuItem'}selected{/if}>页签</option><option value="menuBlank" {if $menu.target=='menuBlank'}selected{/if}>新窗口</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">权限标识：</label><div class="col-sm-8"><input name="perms" class="form-control" value="{$menu.perms}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">图标：</label><div class="col-sm-8"><input name="icon" class="form-control" value="{$menu.icon}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">显示状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="visible" value="0" {if $menu.visible=='0'}checked{/if}>显示</label><label class="radio-box"><input type="radio" name="visible" value="1" {if $menu.visible=='1'}checked{/if}>隐藏</label></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>
var prefix = ctx + "system/menu";

function submitHandler() {
  if ($.validate.form()) {
    $.operate.save(prefix + "/edit", $("#form-menu-edit").serialize());
  }
}

/* 菜单管理-修改-选择上级菜单树 */
function selectMenuTree() {
  var menuId = $("#treeId").val();
  var excludeId = $("input[name='menuId']").val();
  if ($.common.isEmpty(menuId)) {
    menuId = "0";
  }
  $.modal.openOptions({
    title: "菜单选择",
    width: "380",
    url: prefix + "/selectMenuTree/" + menuId + "/" + excludeId,
    callBack: function(index, layero) {
      var body = $.modal.getChildFrame(index);
      $("#treeId").val(body.find("#treeId").val());
      $("#treeName").val(body.find("#treeName").val());
      $.modal.close(index);
    }
  });
}
</script>
</body>
</html>
