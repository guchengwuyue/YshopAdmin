<!DOCTYPE html>
<html lang="zh">
<head>{include file="/common/header" title="添加字典类型" /}</head>
<body class="white-bg">
<div class="wrapper wrapper-content">
<form class="form-horizontal m" id="form-dict-add">
  <div class="form-group"><label class="col-sm-3 control-label is-required">字典名称：</label><div class="col-sm-8"><input name="dictName" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">字典类型：</label><div class="col-sm-8"><input name="dictType" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="0" checked>正常</label><label class="radio-box"><input type="radio" name="status" value="1">停用</label></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea name="remark" class="form-control"></textarea></div></div>
</form>
</div>
{include file="/common/footer" /}
<script>function submitHandler(){ if($.validate.form()){ $.operate.save(ctx+"system/dict/add", $("#form-dict-add").serialize()); } }</script>
</body></html>
